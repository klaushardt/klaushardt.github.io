<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-copy"><span class="brand-name">Echte Blicke</span><span class="brand-note">Fotografie · Philipp Klaushardt</span></span>
    </a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="primary-nav" aria-label="Menü öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg></button>
    <nav class="primary-nav" id="primary-nav" data-open="false" aria-label="Hauptnavigation">
      {{ with .Site.GetPage "/portfolio" }}{{ range .Pages.ByWeight }}<a href="{{ .RelPermalink }}" {{ if eq $.RelPermalink .RelPermalink }}aria-current="page"{{ end }}>{{ .Title }}</a>{{ end }}{{ end }}
      <a href="{{ "/me/" | relURL }}" {{ if eq .RelPermalink "/me/" }}aria-current="page"{{ end }}>Über mich</a>
      <a href="{{ "/faq/" | relURL }}" {{ if eq .RelPermalink "/faq/" }}aria-current="page"{{ end }}>Preise &amp; FAQ</a>
      <a href="{{ "/kontakt/" | relURL }}" {{ if eq .RelPermalink "/kontakt/" }}aria-current="page"{{ end }}>Kontakt</a>
    </nav>
  </div>
</header>
